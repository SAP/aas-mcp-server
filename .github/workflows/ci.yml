name: CI/CD - AAS MCP Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run unit tests
        run: |
          uv run pytest tests/ \
            --verbose \
            --cov=src/aas_mcp_server \
            --cov-report=term-missing \
            --cov-report=xml \
            -m "not integration"

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run ruff (linter)
        run: |
          uv run ruff check src/ tests/
        continue-on-error: true

      - name: Run ruff (formatter check)
        run: |
          uv run ruff format --check src/ tests/
        continue-on-error: true

      - name: Run mypy (type checking)
        run: |
          uv run mypy src/
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          # load=true exports the image to the local Docker daemon so
          # subsequent docker run steps can find it by tag.
          # push=false keeps it local only (no registry push).
          load: true
          push: false
          tags: aas-mcp-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container starts and responds to MCP initialize
        # Fast-fail signal that the freshly built image can boot at all.
        # Full per-component coverage (all four AAS components) lives in the
        # integration-test job below.
        run: |
          # Create a minimal config pointing at the fixture spec that ships
          # in the repository (the image itself contains no spec files).
          mkdir -p test-config
          cat > test-config/config.yaml << 'CONFIGEOF'
          components:
            aas-repo:
              official_spec: /app/spec/sample_official_spec.yaml
              curation:
                allowlist:
                  - [get, "*"]
                aliases: {}
          CONFIGEOF

          # Send a single MCP initialize request and verify the server name
          # in the response. The container exits naturally after stdio closes.
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' | \
          docker run --rm -i \
            -v "$(pwd)/test-config/config.yaml:/app/config/config.yaml" \
            -v "$(pwd)/tests/fixtures/sample_official_spec.yaml:/app/spec/sample_official_spec.yaml" \
            -e AAS_COMPONENT=aas-repo \
            -e AAS_BASE_URL=http://localhost:8081 \
            aas-mcp-server:test | \
          jq -e '.result.serverInfo.name == "AAS MCP Server (aas-repo)"'

  integration-test:
    name: Integration Test — Docker Startup (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [docker]

    strategy:
      fail-fast: false
      matrix:
        component: [aas-repo, submodel-repo, aas-registry, submodel-registry]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image (from GHA cache)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: aas-mcp-server:test
          # Cache was populated by the `docker` job above; this rebuild is a
          # near-instant cache hit and avoids depending on cross-job artifact
          # transfer.
          cache-from: type=gha

      - name: Run docker startup check for ${{ matrix.component }}
        run: |
          scripts/ci/docker-startup-check.sh \
            "${{ matrix.component }}" \
            tests/fixtures/integration/config.yaml.template \
            "tests/fixtures/integration/${{ matrix.component }}-official-spec.yaml"

  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [test, lint, docker, integration-test]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi

          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "❌ Docker build failed"
            exit 1
          fi

          if [ "${{ needs.integration-test.result }}" != "success" ]; then
            echo "❌ Integration test (docker startup) failed"
            exit 1
          fi

          echo "✅ All tests passed!"
