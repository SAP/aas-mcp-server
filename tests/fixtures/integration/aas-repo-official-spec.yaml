openapi: 3.0.3
info:
  title: Asset Administration Shell Repository Service (integration test fixture)
  description: |
    Minimal hand-authored fixture for the aas-repo component, following the
    shape of tests/fixtures/sample_official_spec.yaml. Used only by the CI
    docker startup smoke test.
  version: V3.1.3_SSP-001
paths:
  /shells:
    get:
      tags:
        - Asset Administration Shell Repository API
      summary: Returns all Asset Administration Shells
      operationId: GetAllAssetAdministrationShells
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Requested Asset Administration Shells
    post:
      tags:
        - Asset Administration Shell Repository API
      summary: Creates a new Asset Administration Shell
      operationId: PostAssetAdministrationShell
      responses:
        '201':
          description: Asset Administration Shell created
  /shells/{aasIdentifier}:
    get:
      tags:
        - Asset Administration Shell Repository API
      summary: Returns a specific Asset Administration Shell
      operationId: GetAssetAdministrationShellById
      parameters:
        - name: aasIdentifier
          in: path
          description: The Asset Administration Shell's unique id (UTF8-BASE64-URL-encoded)
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Requested Asset Administration Shell
        '404':
          description: Asset Administration Shell not found
    delete:
      tags:
        - Asset Administration Shell Repository API
      summary: Deletes an Asset Administration Shell
      operationId: DeleteAssetAdministrationShellById
      parameters:
        - name: aasIdentifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Asset Administration Shell deleted
  /shells/{aasIdentifier}/asset-information:
    get:
      tags:
        - Asset Administration Shell Repository API
      summary: Returns the Asset Information of a specific Asset Administration Shell
      operationId: GetAssetInformation
      parameters:
        - name: aasIdentifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Requested Asset Information
