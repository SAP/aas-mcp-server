openapi: 3.0.3
info:
  title: Concept Description Repository Service (integration test fixture)
  description: |
    Minimal fixture derived by manual chunking from the official IDTA
    Concept Description Repository Service OpenAPI spec (see
    https://github.com/admin-shell-io/aas-specs-api/tree/v3.2.0). Retains
    original operationIds and a small, representative subset of endpoints.
    Used only by the CI docker startup smoke test.
  version: V3.2.0_SSP-001
paths:
  /concept-descriptions:
    get:
      tags:
        - Concept Description Repository API
      summary: Returns all Concept Descriptions
      operationId: GetAllConceptDescriptions
      parameters:
        - name: idShort
          in: query
          description: The Concept Description's IdShort
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Requested Concept Descriptions
    post:
      tags:
        - Concept Description Repository API
      summary: Creates a new Concept Description
      operationId: PostConceptDescription
      responses:
        '201':
          description: Concept Description created successfully
  /concept-descriptions/{cdIdentifier}:
    get:
      tags:
        - Concept Description Repository API
      summary: Returns a specific Concept Description
      operationId: GetConceptDescriptionById
      parameters:
        - name: cdIdentifier
          in: path
          description: The Concept Description's unique id (UTF8-BASE64-URL-encoded)
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Requested Concept Description
        '404':
          description: Concept Description not found
    delete:
      tags:
        - Concept Description Repository API
      summary: Deletes a Concept Description
      operationId: DeleteConceptDescriptionById
      parameters:
        - name: cdIdentifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Concept Description deleted successfully
