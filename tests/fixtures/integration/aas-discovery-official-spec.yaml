openapi: 3.0.3
info:
  title: AAS Discovery Service (integration test fixture)
  description: |
    Minimal fixture derived by manual chunking from the official IDTA
    Discovery Service OpenAPI spec (see aas-specs repo). Retains original
    operationIds and a small, representative subset of endpoints.
    Used only by the CI docker startup smoke test.
  version: V3.2.0_SSP-001
paths:
  /lookup/shells:
    get:
      deprecated: true
      tags:
        - Asset Administration Shell Basic Discovery API
      summary: Returns a list of Asset Administration Shell IDs linked to specific asset identifiers or the global asset ID
      operationId: GetAllAssetAdministrationShellIdsByAssetLink
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Requested Asset Administration Shell IDs
  /lookup/shellsByAssetLink:
    post:
      tags:
        - Asset Administration Shell Basic Discovery API
      summary: Returns a list of Asset Administration Shell IDs linked to specific asset identifiers or the global asset ID
      operationId: SearchAllAssetAdministrationShellIdsByAssetLink
      responses:
        '200':
          description: Requested Asset Administration Shell IDs
  /lookup/shells/{aasIdentifier}:
    parameters:
      - name: aasIdentifier
        in: path
        description: The Asset Administration Shell's unique id (UTF8-BASE64-URL-encoded)
        required: true
        schema:
          type: string
    get:
      tags:
        - Asset Administration Shell Basic Discovery API
      summary: Returns a list of specific asset identifiers based on an Asset Administration Shell ID
      operationId: GetAllAssetLinksById
      responses:
        '200':
          description: Requested specific Asset identifiers
    post:
      tags:
        - Asset Administration Shell Basic Discovery API
      summary: Creates new specific asset identifiers linked to an Asset Administration Shell
      operationId: PostAllAssetLinksById
      responses:
        '201':
          description: Specific asset identifiers created
    delete:
      tags:
        - Asset Administration Shell Basic Discovery API
      summary: Deletes all specific asset identifiers linked to an Asset Administration Shell
      operationId: DeleteAllAssetLinksById
      responses:
        '204':
          description: Specific asset identifiers deleted
